<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Materials</title>
<style>
  :root {
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --border: #E4E4E7;
    --text: #18181B;
    --text-muted: #71717A;
    --accent: #2563EB;
    --accent-soft: #EFF4FF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 96px;
  }

  header {
    margin-bottom: 48px;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }

  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 15px;
  }

  .chapters {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  a.chapter {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }

  a.chapter:hover {
    border-color: var(--accent);
    box-shadow: 0 2px 12px rgba(37, 99, 235, 0.08);
    transform: translateY(-1px);
  }

  .chapter-number {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chapter-title {
    font-size: 15px;
    font-weight: 500;
  }

  .empty, .error {
    color: var(--text-muted);
    font-size: 14px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 24px;
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>AI Materials</h1>
    <p>Chapters, in order.</p>
  </header>
  <div class="chapters" id="chapters">
    <div class="empty">Loading chapters&hellip;</div>
  </div>
</main>
<script>
  fetch("manifest.json")
    .then((res) => {
      if (!res.ok) throw new Error("manifest.json not found");
      return res.json();
    })
    .then((chapters) => {
      const container = document.getElementById("chapters");
      container.innerHTML = "";

      if (!chapters.length) {
        container.innerHTML = '<div class="empty">No chapters yet.</div>';
        return;
      }

      chapters.forEach((ch) => {
        const link = document.createElement("a");
        link.className = "chapter";
        link.href = encodeURIComponent(ch.folder) + "/" + encodeURIComponent(ch.file);

        const number = document.createElement("span");
        number.className = "chapter-number";
        number.textContent = ch.number;

        const title = document.createElement("span");
        title.className = "chapter-title";
        title.textContent = ch.title;

        link.appendChild(number);
        link.appendChild(title);
        container.appendChild(link);
      });
    })
    .catch((err) => {
      document.getElementById("chapters").innerHTML =
        '<div class="error">Could not load manifest.json. If you\'re previewing locally, serve this folder over HTTP (e.g. <code>npx serve .</code>) rather than opening index.html directly.</div>';
      console.error(err);
    });
</script>
</body>
</html>
